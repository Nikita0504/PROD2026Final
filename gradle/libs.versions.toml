#[versions]
#agp = "9.1.0"
#coreKtx = "1.10.1"
#junit = "4.13.2"
#junitVersion = "1.1.5"
#espressoCore = "3.5.1"
#lifecycleRuntimeKtx = "2.6.1"
#activityCompose = "1.8.0"
#kotlin = "2.2.10"
#composeBom = "2024.09.00"
#
#[libraries]
#androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
#junit = { group = "junit", name = "junit", version.ref = "junit" }
#androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
#androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
#androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
#androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
#androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
#androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
#androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
#androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
#androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
#androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
#androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
#androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
#
#[plugins]
#android-application = { id = "com.android.application", version.ref = "agp" }
#kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
#


[versions]
# SDK
compileSdk = "36"
minSdk = "26"
targetSdk = "35"

# Core
agp                  = "9.1.0"
kotlin               = "2.3.10"
ksp                  = "2.3.6"

# AndroidX
coreKtx              = "1.17.0"
appcompat            = "1.7.1"
activityCompose      = "1.12.4"
lifecycleRuntime     = "2.10.0"
navigationCompose    = "2.9.7"

# Compose
composeBom           = "2026.02.01"

# Coroutines
coroutines           = "1.10.2"

# Room
room                 = "2.8.4"

# Koin
koin                 = "4.1.1"

# Ktor
ktor                 = "3.4.1"

# Serialization
serializationJson    = "1.10.0"

# Coil (загрузка изображений)
coil                 = "3.4.0"

# DataStore
datastore            = "1.2.0"

# Tests
junit                = "4.13.2"
junitExt             = "1.3.0"
espressoCore         = "3.7.0"
mockk                = "1.14.9"
turbine              = "1.2.1"

# Misc
kotlinxDatetime      = "0.7.1"
material = "1.10.0"


[libraries]

# ─────────────────────────────────────
# AndroidX Core
# ─────────────────────────────────────
core-ktx              = { module = "androidx.core:core-ktx",            version.ref = "coreKtx" }
appcompat             = { module = "androidx.appcompat:appcompat",       version.ref = "appcompat" }
activity-compose      = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# ─────────────────────────────────────
# Lifecycle / ViewModel
# ─────────────────────────────────────
lifecycle-runtime-ktx          = { module = "androidx.lifecycle:lifecycle-runtime-ktx",          version.ref = "lifecycleRuntime" }
lifecycle-viewmodel-compose    = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",    version.ref = "lifecycleRuntime" }
lifecycle-runtime-compose      = { module = "androidx.lifecycle:lifecycle-runtime-compose",      version.ref = "lifecycleRuntime" }

# ─────────────────────────────────────
# Compose BOM + UI
# ─────────────────────────────────────
compose-bom                    = { module = "androidx.compose:compose-bom",                    version.ref = "composeBom" }
compose-ui                     = { module = "androidx.compose.ui:ui" }
compose-ui-graphics            = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview     = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling             = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest       = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4         = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material3              = { module = "androidx.compose.material3:material3" }
compose-icons-extended         = { module = "androidx.compose.material:material-icons-extended" }
compose-animation              = { module = "androidx.compose.animation:animation" }

# ─────────────────────────────────────
# Navigation
# ─────────────────────────────────────
navigation-compose             = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# ─────────────────────────────────────
# Coroutines
# ─────────────────────────────────────
coroutines-core                = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
coroutines-android             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test                = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }

# ─────────────────────────────────────
# Room
# ─────────────────────────────────────
room-runtime                   = { module = "androidx.room:room-runtime",  version.ref = "room" }
room-ktx                       = { module = "androidx.room:room-ktx",      version.ref = "room" }
room-compiler                  = { module = "androidx.room:room-compiler", version.ref = "room" }  # ksp()
room-testing                   = { module = "androidx.room:room-testing",  version.ref = "room" }

# ─────────────────────────────────────
# Koin
# ─────────────────────────────────────
koin-android                   = { module = "io.insert-koin:koin-android",           version.ref = "koin" }
koin-compose                   = { module = "io.insert-koin:koin-compose",           version.ref = "koin" }
koin-compose-viewmodel         = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core                      = { module = "io.insert-koin:koin-core",              version.ref = "koin" }
koin-test                      = { module = "io.insert-koin:koin-test",              version.ref = "koin" }
koin-test-junit4               = { module = "io.insert-koin:koin-test-junit4",       version.ref = "koin" }

# ─────────────────────────────────────
# Ktor Client
# ─────────────────────────────────────
ktor-client-core               = { module = "io.ktor:ktor-client-core",                     version.ref = "ktor" }
ktor-client-android            = { module = "io.ktor:ktor-client-android",                  version.ref = "ktor" }
ktor-client-okhttp             = { module = "io.ktor:ktor-client-okhttp",                   version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation",    version.ref = "ktor" }
ktor-client-logging            = { module = "io.ktor:ktor-client-logging",                  version.ref = "ktor" }
ktor-client-auth               = { module = "io.ktor:ktor-client-auth",                     version.ref = "ktor" }
ktor-serialization-json        = { module = "io.ktor:ktor-serialization-kotlinx-json",      version.ref = "ktor" }
ktor-client-mock               = { module = "io.ktor:ktor-client-mock",                     version.ref = "ktor" }

# ─────────────────────────────────────
# Serialization
# ─────────────────────────────────────
kotlinx-serialization-json     = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

# ─────────────────────────────────────
# DataStore
# ─────────────────────────────────────
datastore-preferences          = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ─────────────────────────────────────
# Coil (изображения)
# ─────────────────────────────────────
coil-compose                   = { module = "io.coil-kt.coil3:coil-compose",        version.ref = "coil" }
coil-network-okhttp            = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# ─────────────────────────────────────
# Kotlinx DateTime
# ─────────────────────────────────────
kotlinx-datetime               = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# ─────────────────────────────────────
# Tests
# ─────────────────────────────────────
junit                          = { module = "junit:junit",                                    version.ref = "junit" }
junit-ext                      = { module = "androidx.test.ext:junit",                       version.ref = "junitExt" }
espresso-core                  = { module = "androidx.test.espresso:espresso-core",          version.ref = "espressoCore" }
mockk                          = { module = "io.mockk:mockk",                                version.ref = "mockk" }
turbine                        = { module = "app.cash.turbine:turbine",                      version.ref = "turbine" }

# ─────────────────────────────────────
# Gradle Plugins as libraries (для build-logic/build.gradle.kts)
# ─────────────────────────────────────
android-gradlePlugin  = { module = "com.android.tools.build:gradle",                        version.ref = "agp" }
kotlin-gradlePlugin   = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin",             version.ref = "kotlin" }
kotlin-compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin      = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin     = { module = "androidx.room:room-gradle-plugin",                       version.ref = "room" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }


[bundles]
# Готовые наборы для convention plugins
compose-core = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-animation",
    "activity-compose",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-compose",
]
ktor-client = [
    "ktor-client-core",
    "ktor-client-android",
    "ktor-client-okhttp",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-client-auth",
    "ktor-serialization-json",
]
koin-android-full = [
    "koin-android",
    "koin-core",
    "koin-compose",
    "koin-compose-viewmodel",
]
room-full = [
    "room-runtime",
    "room-ktx",
]
unit-test = [
    "junit",
    "mockk",
    "coroutines-test",
    "turbine",
]
android-test = [
    "junit-ext",
    "espresso-core",
    "compose-ui-test-junit4",
]


[plugins]
android-application        = { id = "com.android.application",                        version.ref = "agp" }
android-library            = { id = "com.android.library",                            version.ref = "agp" }
kotlin-android             = { id = "org.jetbrains.kotlin.android",                   version.ref = "kotlin" }
kotlin-compose             = { id = "org.jetbrains.kotlin.plugin.compose",            version.ref = "kotlin" }
kotlin-serialization       = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin" }
ksp                        = { id = "com.google.devtools.ksp",                        version.ref = "ksp" }
room                       = { id = "androidx.room",                                  version.ref = "room" }
